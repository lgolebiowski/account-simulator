line-length = 100
target-version = "py312"
extend-exclude = [".venv", ".claude/worktrees"]

[lint]
# Real problems only: pycodestyle errors (E4/E7/E9), pyflakes (F), likely bugs (B).
# Style-only rules (line length, `l` variable names, UP/SIM modernising) are off on purpose.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "E741",  # ambiguous variable name `l`
    "E731",  # lambda assignment (used in a few test helpers)
]

[lint.flake8-bugbear]
# FastAPI's Depends(...) in default arguments is the framework's normal pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[lint.per-file-ignores]
# BASELINE: findings that existed before ruff was added. Fix them, then delete these lines.
"bankapp/services.py" = ["B904"]
"cli.py" = ["B904"]
"tests/test_api_auth.py" = ["F401"]
"tests/test_transfer.py" = ["F401"]
